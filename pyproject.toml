[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pantilt"
version = "0.1.0"
description = "视听融合声源定位与目标跟踪云台系统 (Audio-Visual Pan-Tilt Tracking System)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Rays", email = "ss20051213rays@gmail.com" }
]
dependencies = [
    "PyYAML>=6.0",
    "numpy>=1.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]
pi = [
    "opencv-python>=4.5.0",
    "mediapipe>=0.10.0",
    "sounddevice>=0.4.0",
    "pyserial>=3.5",
    "pigpio>=1.78",
]

[project.scripts]
pantilt = "pantilt.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v"

