# Offline-friendly defaults for the mock PTZ pipeline
sample_rate: 16000
frame_ms: 32
clap_energy_threshold: 0.35
clap_cooldown_s: 1.0
mic_distance_m: 0.06
speed_of_sound: 343.0

camera_width: 640
camera_height: 480
face_lost_timeout_s: 2.0
follow_deadzone_px: 40
follow_step_deg: 2.0

servo_min_deg: -60.0
servo_max_deg: 60.0
servo_center_deg: 0.0
turn_tolerance_deg: 2.0
turn_timeout_s: 2.0
control_hz: 30

mode: mock   # mock | hardware (hardware not required for offline)
