# 视听融合声源定位与目标跟踪云台 · 默认配置
# 所有可调参数统一在此文件管理，源码中不硬编码阈值 / 限位 / 步长
# 本配置已对齐当前硬件方案（2-DOF 总线舵机、微雪驱动板、酷态科独立供电、OV9281 120fps、AC3104 双麦）。
# ArUco 靶标、50mW 激光器与 ESP32 协处理器已于 2026-11-22 移出范围，相关参数仅作历史保留，不再装配。

# ── 配置元数据 ──────────────────────────────────────────────────────────────
config_version: "0.3.0"          # 0.3.0：主程序接入离线唤醒、双麦测向与回应

# ── 音频参数（M3: AC3104 双麦，TLV320AIC3104 兼容，非 WM8960）──────────────────
audio:
  device_name: ""                 # 留空则 sounddevice 自动选择；Pi 上声卡为 respeaker-2mic-ac3104 (hw:3,0)
  sample_rate: 16000              # Hz，AC3104 实测支持 16000 / 44100 双声道
  channels: 2                     # 双通道，左通道 ch0，右通道 ch1
  dtype: "int16"

  # 采集块（回调不做 FFT，只复制 PCM）
  blocksize: 1024                 # 采样点数，约 64 ms @ 16 kHz

  # 声音事件检测（SED）
  energy_threshold: 0.05          # RMS 阈值（归一化 0–1），需根据实测环境调整
  min_event_gap_ms: 300           # 锁存时间（ms），防止余振重复触发
  pre_roll_ms: 50                 # 触发前预滚窗口（ms），用于 GCC-PHAT 捕获起始

  # GCC-PHAT 定位
  # ── 实机标定（2026-11-26）──────────────────────────────────────────────
  # 板标称间距 65 mm，但 11-22 由 ±90° 实测时延 137 μs 反推有效声学间距为 0.047~0.050 m；
  # 11-26 唤醒测向以 0.048 m 实测：左 45° 三次 -46.3~-50.6°，正前 -1.4°/+0.7°，侧别 7/7 正确。
  # 若沿用 0.065，按 137 μs 实测时延会估算为约 46°，低估 ±90° 方位；正式补样后再微调。
  mic_spacing_m: 0.048
  sound_speed_mps: 343.0          # 声速（m/s）
  audio_zero_deg: 0.0             # 声学零点偏置（°）：11-26 正前两次均值 -0.39°，暂保持 0，补样后修正
  gcc_confidence_threshold: 0.3   # 低于此值切换能量差降级模式
  fallback_angle_deg: 30.0        # 侧别降级时的固定转角（°）

# ── 相机与目标跟踪参数（M4: OV9281 全局快门 / 人脸检测）──────────────────────
camera:
  backend: "v4l2"                 # Linux Pi 优先 V4L2，避免 OpenCV GStreamer 自动回退抖动
  device_index: 0                 # /dev/video0 设备编号
  width: 640                      # 取流宽度（可设 1280x800 或 640x400 以降低算力）
  height: 400                     # 取流高度
  detect_fps: 120                 # 请求相机的传输帧率，实际值由 UVC 驱动协商
  capture_output_fps: 30          # 软件限制解码和发布帧率，较旧的帧直接跳过（0 = 关闭限制）
  inference_fps: 30               # 转向、寻脸和跟踪时的人脸检测帧率上限
  idle_inference_fps: 5           # 待机和手动控制时保留低频检测
  opencv_threads: 2               # 进程内 OpenCV 线程预算（0 = 使用 OpenCV 默认）
  camera_cx: 320                  # 水平图像中心列（= width / 2）
  camera_cy: 200                  # 垂直图像中心行（= height / 2）

  # 阶段 4 锁定纯人脸跟踪；ArUco 属于已移出范围的旧方案
  target_mode: "face"

  # 已移出范围（2026-11-22）：保留参数仅为兼容旧配置，target_mode 固定为 "face"，勿切回 aruco
  aruco:
    dictionary: "DICT_4X4_50"     # 对应采购的 4x4 50 字典
    target_ids: [10, 11, 12, 13, 14, 15, 16, 17] # 采购的标志板 ID 组
    marker_size_m: 0.12           # 物理尺寸 12 cm = 0.12 m

  # 保留 320x200 的检测输入，预览和控制坐标使用原始画面尺寸
  detector: "yunet"               # "yunet" | "mediapipe" | "haar"
  yunet_model: "assets/models/face_detection_yunet_2023mar.onnx"
  detection_width: 320
  detection_height: 200
  min_detection_confidence: 0.5
  face_smoothing_alpha: 0.6        # 人脸中心 EMA 平滑系数
  face_max_jump_px: 160            # 防跳脸：旧目标中心最大允许跳变
  target_lost_reset_frames: 5      # 连续丢失后允许重新选最大脸
  observation_timeout_s: 0.3      # 观测超过此时间不再用于云台控制

# ── 舵机与执行器参数（M2: 总线舵机二维平台 + 微雪 Bus Servo Adapter）─────────
servo:
  driver_type: "bus"              # "bus"（推荐：微雪通用型总线舵机驱动板） | "pwm"（旧版 GPIO 18 SG90 兼容）

  # 串行总线舵机配置 (Waveshare Bus Servo / ST3215 / SC15)
  serial_port: "/dev/ttyACM0"     # 微雪驱动板 USB/串口连接端（或树莓派 /dev/ttyAMA0）
  # ── 实机标定结果（2026-11-21 实测）────────────────────────────────────
  # 波特率：本批 SP-15S 出厂即为 115200 bps（波特率档位寄存器 0x06 = 4）。
  #         官方示例默认的 1000000 (1Mbps) 在本批舵机上完全无应答，勿改回。
  baudrate: 115200
  # 串口附加设置：该半双工适配器必须把 RTS 拉高才能稳定收到舵机应答，
  #               否则应答丢包率极高（实测 1/12 ~ 7/12 波动）。
  #               对应 ServoController 中的 serial_rts: true。
  serial_rts: true

  # 舵机 ID: 出厂两颗都是 0（同一地址会同时抢答、无法独立控制）。
  # 已用 scripts/hw/bus_servo_setid.py 逐颗改写并验证：
  #   水平 Yaw   舵机：0 -> 1   ✅ 2026-11-21 完成（Ping 10/10，原 ID 0 归零）
  #   垂直 Pitch 舵机：0 -> 2   ✅ 2026-11-21 完成（Ping 10/10，原 ID 0 归零）
  #   当前总线仅剩 ID 1 / ID 2 两颗，互不冲突，可独立控制。
  yaw_id: 1                       # 水平偏航舵机 ID ✅ 实测验证通过
  pitch_id: 2                     # 垂直俯仰舵机 ID ✅ 实测验证通过

  # 角度限位与方向（度）
  min_yaw_angle: -90.0            # 水平最小限位（°）
  max_yaw_angle: 90.0             # 水平最大限位（°）
  min_pitch_angle: -30.0          # 俯仰最小限位（°，低头）
  max_pitch_angle: 45.0           # 俯仰最大限位（°，抬头）

  yaw_sign: 1                     # 水平运动方向修正：1 或 -1（2026-11-22 实测确认：-20° 逆时针向左，1 正确）
  pitch_sign: 1                   # 俯仰运动方向修正：1 或 -1（2026-11-22 实测确认：+15° 向上抬头，1 正确）
  yaw_offset_deg: 33.0            # 水平机械零位偏置（°）：2026-11-22 实机微调校平
  pitch_offset_deg: -17.0         # 俯仰机械零位偏置（°）：2026-11-22 实机微调校平

  # 跟踪死区、角速度与加速度
  step_deg_yaw: 2.0               # 水平每次步进量（°）
  step_deg_pitch: 1.5             # 俯仰每次步进量（°）
  deadzone_px_x: 30               # 水平视觉死区（像素）
  deadzone_px_y: 25               # 垂直视觉死区（像素）
  tracking_yaw_gain: 0.50         # 死区外每像素对应的水平角速度（°/s/px）
  tracking_pitch_gain: 0.40       # 死区外每像素对应的俯仰角速度（°/s/px）
  max_yaw_speed_deg_s: 42.0       # 水平跟踪速度上限（°/s）
  max_pitch_speed_deg_s: 28.0     # 俯仰跟踪速度上限（°/s）
  yaw_accel_deg_s2: 210.0         # 水平跟踪加减速上限（°/s²）
  pitch_accel_deg_s2: 150.0       # 俯仰跟踪加减速上限（°/s²）

  # ── 旧版 PWM 驱动兼容参数（当 driver_type 为 "pwm" 时生效）──
  servo_gpio: 18                  # 树莓派硬件 PWM 引脚
  pulse_min_us: 500
  pulse_max_us: 2500
  servo_mid: 1500
  min_angle: -90.0
  max_angle: 90.0
  servo_sign: 1
  step_deg: 2.0
  deadzone_px: 30

# ── 激光指示器参数（已移出范围，2026-11-22）───────────────────────────────
# 激光执行器不再装配（bootstrap 不创建 LaserIndicator）；保留段落仅为兼容旧配置与 Web 遥测字段。
laser:
  enabled: false                  # 保持 false；主程序已不读取激光依赖
  control_mode: "gpio"            # "gpio"（通过树莓派/MOSFET 引脚） | "esp32"（通过 ESP32 协处理器串口指令）
  gpio_pin: 23                    # 树莓派控制引脚 (BCM 23)
  lock_min_frames: 3              # 连续稳定在死区中心多少帧才点亮激光
  max_continuous_s: 10.0          # 安全保护：单次最大持续点亮时间（秒），防过热与人眼安全

# ── 异构双主控 (ESP32 协处理器) 配置 ───────────────────────────────────────
dual_mcu:
  esp32_enabled: false            # true 时通过 ESP32 协处理器中转总线与激光；false 时树莓派直连微雪驱动板
  esp32_port: "/dev/ttyUSB1"      # ESP32 串口端点
  esp32_baudrate: 115200

# ── 控制逻辑参数（M5）─────────────────────────────────────────────────────
control:
  turn_timeout_s: 1.5             # 粗测向转向超时（s），超时后进入寻脸
  lost_timeout_s: 0.0              # TRACK_FACE 丢脸后默认不超时退出，保持等待续跟
  turn_settle_s: 0.3              # 转向到位平息时间（s）
  search_pitch_deg: 30.0           # 进入寻脸前预抬俯仰，适配近距（约0.5m）人脸取景
  search_timeout_s: 4.5            # 寻脸微扫总时长（s），结束后安全回中
  search_sweep_interval_s: 0.5    # 微扫目标变更间隔（s）
  recovery_delay_s: 0.12          # 边缘丢脸后等待短暂遮挡过去（s）
  recovery_timeout_s: 1.4         # 单次出画续跟的最长搜索时长（s）
  recovery_yaw_deg: 22.0          # 沿出画方向最多补扫的水平角（°）
  recovery_pitch_deg: 12.0        # 沿出画方向最多补扫的俯仰角（°）
  main_loop_hz: 30                # 主循环和跟踪舵机下发频率（Hz）

# ── 离线唤醒词（Pi 上使用 sherpa-onnx，资源位于项目外）─────────────────────
wakeup:
  enabled: true
  model_dir: "~/.local/share/pantilt-kws/models/sherpa-onnx-kws-zipformer-wenetspeech-3.3M-2024-01-01"
  keywords_file: "configs/kws_wenetspeech.txt"
  threshold: 0.15
  score: 1.5
  input_gain: 4.0
  num_threads: 1
  max_active_paths: 4
  provider: "cpu"

# ── 音箱回应参数（唤醒后播放「我在」）──────────────────────────────────────
speaker:
  enabled: true
  audio_file: "assets/audio/wakeup_reply.wav" # 16 kHz / 16 bit 双声道，经 AC3104 SPK 输出
  device: "hw:CARD=respeaker2micac,DEV=0"
  reply_cooldown_s: 0.5
  lock_min_frames: 2              # 旧配置字段保留，当前回应由唤醒事件触发

# ── 屏幕显示参数（桌面预览由 scripts/hw/camera_preview.py --desktop 提供）────
display:
  enabled: false                  # 主程序默认无头运行；需要本地预览时用探针脚本的 --desktop
  window_name: "Pan-Tilt Live Camera"
  show_hud: true                  # 是否在图像上绘制锁定框、十字准星与状态文字
  window_width: 640               # 显示窗口宽度
  window_height: 480              # 显示窗口高度

# ── 日志参数（M0）──────────────────────────────────────────────────────────
logging:
  level: "INFO"                   # DEBUG | INFO | WARNING | ERROR
  log_to_file: true
  log_dir: "logs"                 # 日志目录（相对项目根）
  log_fields:                     # 结构化日志字段
    - timestamp_mono
    - state
    - theta_audio
    - dx
    - dy
    - theta_cmd_yaw
    - theta_cmd_pitch
    - fps
    - event

# ── Web HUD 监视中心与通信服务（M7 拓展）──────────────────────────────────
web:
  enabled: true                   # 是否启动 Web 运行时适配器
  host: "0.0.0.0"                 # 监听地址（0.0.0.0 允许局域网/千兆网口访问）
  port: 8080                      # Web 端口
  telemetry_hz: 10                # SSE 遥测推流频率 (Hz)
  mjpeg_fps: 15                   # MJPEG 视频推流帧率上限 (FPS)
  mjpeg_quality: 75               # JPEG 图像压缩质量 (1~100)
  cors_enabled: true              # 跨域支持
